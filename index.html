<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gemi Bileşen Kaydı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: sticky ship-bridge header, project list → project with category tabs → item sheets. Tokens below. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --surface2:#f6f8f9; --ink:#0f2433; --muted:#5a6d7a; --line:#d5dee3;
  --accent:#0b6e8a; --accent-ink:#ffffff; --accent-soft:#dcedf2;
  --good:#1f7a4d; --good-soft:#dff1e7; --warn:#a6620a; --warn-soft:#fbeed8; --bad:#b3261e; --bad-soft:#f9e0de; --info:#3f5aa8; --info-soft:#e3e8f7;
  --hdr:#0f2433; --hdr-ink:#e9f1f5;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1820; --surface:#12232e; --surface2:#172b37; --ink:#e3edf2; --muted:#93a8b5; --line:#24404f;
  --accent:#4cb6d4; --accent-ink:#06202a; --accent-soft:#163847;
  --good:#5cc993; --good-soft:#123528; --warn:#e9a64a; --warn-soft:#3a2a12; --bad:#f08a82; --bad-soft:#3d1b19; --info:#93a9f0; --info-soft:#1c2647;
  --hdr:#07131a; --hdr-ink:#e3edf2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1820; --surface:#12232e; --surface2:#172b37; --ink:#e3edf2; --muted:#93a8b5; --line:#24404f;
  --accent:#4cb6d4; --accent-ink:#06202a; --accent-soft:#163847;
  --good:#5cc993; --good-soft:#123528; --warn:#e9a64a; --warn-soft:#3a2a12; --bad:#f08a82; --bad-soft:#3d1b19; --info:#93a9f0; --info-soft:#1c2647;
  --hdr:#07131a; --hdr-ink:#e3edf2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-ink)}
header.app .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;min-height:60px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;min-width:0}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.08em;opacity:.7;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:transparent;border:1px solid rgba(233,241,245,.3);color:var(--hdr-ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;flex:none}
.hbtn:hover{border-color:var(--hdr-ink)}
.grow{flex:1;min-width:0}
main{padding-block:20px 80px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.02em;text-wrap:balance;margin:0}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;color:inherit}
.pcard:hover{border-color:var(--accent)}
.pcard .ship{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.counts{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip b{font-weight:500;color:var(--accent)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--muted);margin-top:16px}
.empty h3{color:var(--ink);margin-bottom:6px}
.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted);margin-top:6px}
.meta span b{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:20px;scrollbar-width:thin}
.tab{flex:none;border:0;background:none;font:inherit;padding:10px 14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.03em}
.tab .n{font-family:var(--f-mono);font-size:12px;margin-left:6px;background:var(--surface2);border-radius:999px;padding:1px 7px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-block:14px}
.toolbar input,.toolbar select{flex:1 1 160px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.item:hover{border-color:var(--accent)}
.thumb{width:84px;height:64px;border-radius:6px;background:var(--surface2);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:11px;overflow:hidden}
.item .t{min-width:0}
.item .nm{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.code{font-family:var(--f-mono);font-size:12px}
.status{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.s-good{background:var(--good-soft);color:var(--good)} .s-warn{background:var(--warn-soft);color:var(--warn)}
.s-bad{background:var(--bad-soft);color:var(--bad)} .s-info{background:var(--info-soft);color:var(--info)}
.s-none{background:var(--surface2);color:var(--muted)}
@media (max-width:520px){.item{grid-template-columns:64px 1fr}.item .thumb{width:64px;height:56px}.item .status{grid-column:2;justify-self:start}}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(5,15,22,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);border-radius:14px 14px 0 0;z-index:1}
.sheet-b{padding:18px;display:flex;flex-direction:column;gap:18px}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0;background:var(--surface)}
legend{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2);display:flex;flex-direction:column}
.ph img,.ph .ph-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.ph .ph-img{display:grid;place-items:center;color:var(--muted);font-size:12px}
.ph .ctrl{display:flex;gap:4px;padding:6px}
.ph .ctrl select{padding:5px 6px;font-size:12px}
.ph .x{border:0;background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:0 9px;cursor:pointer;font-size:16px}
.ph .cap{font-size:12px;padding:5px 8px;font-weight:500}
.ph button.open{border:0;padding:0;cursor:zoom-in;background:none}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 18px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12px;color:var(--muted)}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.note{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.lightbox img{max-width:100%;max-height:80vh;object-fit:contain}
.lightbox .cap{color:#fff;font-family:var(--f-mono);font-size:13px}
.lightbox .row button{background:#ffffff22;color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-size:14px;max-width:calc(100% - 32px)}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.example{font-family:var(--f-mono);font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.pcard,.item,.btn{transition:border-color .15s}}

.auth{max-width:420px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.userbar{font-family:var(--f-mono);font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}

</style>
</head>
<body>
<header class="app"><div class="wrap">
  <button class="hbtn" id="backBtn" hidden aria-label="Projelere dön">← Projeler</button>
  <div class="brand grow">Gemi Bileşen Kaydı<small id="hdrSub">Kamera · kablo · ağ cihazı envanteri</small></div>
  <span class="userbar" id="userBar"></span>
  <button class="hbtn" id="logoutBtn" hidden>Çıkış</button>
</div></header>
<main class="wrap" id="app"><p class="muted">Yükleniyor…</p></main>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
